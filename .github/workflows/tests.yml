name: CI & Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install plyer pylint

      - name: Run Pylint Code Quality Check
        run: |
          pylint --fail-under=9.5 models/ services/ gui/ main.py

      - name: Install Virtual Display (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run Unit Tests
        run: |
          xvfb-run -a python -m unittest discover -s tests -p "test_*.py"
