name: Build and Release Executable

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_suffix: Windows-x64.zip
          - os: ubuntu-latest
            asset_suffix: Linux-x64.tar.gz
          - os: macos-latest
            asset_suffix: macOS-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller plyer

      - name: Build Executable
        run: python build.py

      - name: Package Windows Artifact
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path dist/TaskManagerSuite -DestinationPath TaskManagerSuite-${{ matrix.asset_suffix }}

      - name: Package Unix Artifact
        if: matrix.os != 'windows-latest'
        run: |
          tar -czvf TaskManagerSuite-${{ matrix.asset_suffix }} -C dist TaskManagerSuite

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: executable-${{ matrix.os }}
          path: TaskManagerSuite-${{ matrix.asset_suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Prepare Release Assets
        run: |
          mkdir release-assets
          find downloaded-artifacts -type f -name "TaskManagerSuite-*" -exec cp {} release-assets/ \;

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
