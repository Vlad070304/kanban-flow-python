name: CI & Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install plyer pylint
          # If you have a requirements.txt, uncomment the line below:
          # pip install -r requirements.txt

      - name: Run Pylint Code Quality Check
        run: |
          # Lint your core packages and main script
          pylint models/ services/ gui/ main.py

      - name: Run Unit Tests
        run: |
          # Run python unittest discovery
          python -m unittest discover -s tests -p "test_*.py"
