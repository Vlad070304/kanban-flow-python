name: Type Checking and Linting

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: Tests, mypy, and Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Run mypy
        run: python -m mypy

      - name: Run unit tests
        run: python -m coverage run --source=models,services,gui -m unittest discover -s tests -p "test_*.py" -v

      - name: Run release smoke test
        run: python release_smoke_test.py

      - name: Report model and service coverage
        run: python -m coverage report --show-missing --include="models/*,services/*" --fail-under=75

      - name: Report GUI coverage
        run: python -m coverage report --show-missing --include="gui/*" --fail-under=20

      - name: Generate coverage artifact
        run: python -m coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
